<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAC · 天赋档案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --isac-orange: #ff8500;
            --bg-dark: rgba(12, 12, 18, 0.94);
            --border-glow: rgba(255, 133, 0, 0.4);
            --text-primary: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --panel-bg: rgba(20, 20, 28, 0.7);
        }

        body {
            background-color: #0a0a0f;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(255, 133, 0, 0.12) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 133, 0, 0.05) 2px, rgba(255, 133, 0, 0.05) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 133, 0, 0.05) 2px, rgba(255, 133, 0, 0.05) 4px);
            font-family: 'Segoe UI', 'Orbitron', 'Rajdhani', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* 扫描线 (装饰) */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.5;
            z-index: 10;
        }

        /* 主卡片 */
        .talent-card {
            background: var(--bg-dark);
            max-width: 860px;
            border-left: 5px solid var(--isac-orange);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 133, 0, 0.2) inset, 0 0 15px rgba(255, 133, 0, 0.25);
            padding: 32px;
            clip-path: polygon(0 0, 98% 0, 100% 3%, 100% 100%, 2% 100%, 0 97%);
            backdrop-filter: blur(1px);
            margin: 0;
            position: relative;
        }

        .deco-dots {
            position: absolute;
            top: 18px;
            right: 22px;
            display: flex;
            gap: 6px;
        }
        .dot {
            width: 5px;
            height: 5px;
            background: var(--isac-orange);
            box-shadow: 0 0 4px var(--isac-orange);
            border-radius: 1px;
        }

        /* 头部区域 */
        .talent-header {
            display: flex;
            gap: 1.8rem;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .talent-icon {
            width: 80px;
            height: 80px;
            background: #11161f;
            border: 2px solid var(--isac-orange);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .talent-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .talent-name {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffc285);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }
        .talent-eng {
            font-size: 1rem;
            color: var(--isac-orange);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }

        /* 描述区域 */
        .talent-description {
            background: var(--panel-bg);
            border-left: 3px solid var(--isac-orange);
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            border-radius: 0 8px 8px 0;
        }
        .desc-text {
            color: var(--text-primary);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-line;
        }

        /* 来源部位 - 美观的徽章网格 */
        .source-section {
            margin-top: 0.2rem;
        }
        .source-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--isac-orange);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .weapon-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .weapon-badge {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 133, 0, 0.5);
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #ffda99;
            backdrop-filter: blur(2px);
            transition: 0.1s;
        }
        .weapon-badge:hover {
            border-color: var(--isac-orange);
            background: rgba(255, 133, 0, 0.2);
        }

        .footer-divider {
            margin-top: 1.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-glow);
            text-align: right;
            font-size: 0.6rem;
            color: var(--text-dim);
            font-family: monospace;
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .talent-card { padding: 1.2rem; }
            .talent-name { font-size: 1.5rem; }
            .weapon-badge { font-size: 0.7rem; padding: 0.3rem 0.8rem; }
        }
    </style>
</head>
<body>
<div class="scanline"></div>
<div class="talent-card">
    <div class="deco-dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <!-- 头部 -->
    <div class="talent-header">
        <div class="talent-icon">
            <img src="{{ talent.icon_url }}" alt="{{ talent.name }}" onerror="this.src='https://placehold.co/80x80/ff8500/111?text=?'">
        </div>
        <div class="talent-title">
            <div class="talent-name">{{ talent.name }}</div>
            <div class="talent-eng">{{ talent.eng_name }}</div>
        </div>
    </div>

    <!-- 描述 -->
    <div class="talent-description">
        <div class="desc-text">{{ talent.description | safe }}</div>
    </div>

    <!-- 来源部位：使用 Jinja split 将换行符拆分为列表，循环生成徽章 -->
    <div class="source-section">
        <div class="source-label">⚙️ 可装配装备</div>
        <div class="weapon-grid">
            {% set weapons = talent.type.split('\n') %}
            {% for weapon in weapons %}
                {% if weapon|trim != '' %}
                    <span class="weapon-badge">{{ weapon }}</span>
                {% endif %}
            {% endfor %}
        </div>
    </div>

    <div class="footer-divider">
        <span>◈ ISAC 战术分析 · 天赋数据库 ◈</span>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAC · 天赋档案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --isac-orange: #ff8500;
            --bg-dark: rgba(12, 12, 18, 0.94);
            --border-glow: rgba(255, 133, 0, 0.4);
            --text-primary: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --panel-bg: rgba(20, 20, 28, 0.7);
        }

        /* 无接缝背景 */
        html {
            background-color: #0a0a0f;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(255, 133, 0, 0.12) 0%, transparent 70%),
                linear-gradient(0deg, transparent 0px, transparent 19px, rgba(255, 133, 0, 0.1) 20px, transparent 21px),
                linear-gradient(90deg, transparent 0px, transparent 19px, rgba(255, 133, 0, 0.1) 20px, transparent 21px);
            background-size: auto, 100% 40px, 40px 100%;
            background-repeat: no-repeat, repeat, repeat;
        }

        body {
            width: 1584px;          /* 1320 * 1.2 */
            margin: 0 auto;
            padding: 46px;          /* 38 * 1.2 ≈ 45.6 → 46px */
            background: transparent;
            font-family: 'Segoe UI', 'Orbitron', 'Rajdhani', 'Roboto', sans-serif;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.5;
            z-index: 10;
        }

        .talent-card {
            background: var(--bg-dark);
            width: 100%;
            border-left: 10px solid var(--isac-orange);
            box-shadow: 0 38px 66px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 133, 0, 0.2) inset, 0 0 29px rgba(255, 133, 0, 0.3);
            padding: 53px 60px 60px 60px;
            clip-path: polygon(0 0, 98% 0, 100% 3%, 100% 100%, 2% 100%, 0 97%);
            backdrop-filter: blur(1px);
            position: relative;
        }

        .deco-dots {
            position: absolute;
            top: 34px;
            right: 41px;
            display: flex;
            gap: 12px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: var(--isac-orange);
            box-shadow: 0 0 7px var(--isac-orange);
            border-radius: 1px;
        }

        .talent-header {
            display: flex;
            gap: 2.9rem;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border-glow);
            padding-bottom: 2.3rem;
            margin-bottom: 2.3rem;
        }

        .talent-icon {
            width: 151px;
            height: 151px;
            background: #11161f;
            border: 4px solid var(--isac-orange);
            border-radius: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .talent-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .talent-name {
            font-size: 3.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffc285);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .talent-eng {
            font-size: 1.9rem;
            color: var(--isac-orange);
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
        }

        .talent-description {
            background: var(--panel-bg);
            border-left: 6px solid var(--isac-orange);
            padding: 1.9rem 2.3rem;
            margin-bottom: 2.9rem;
            border-radius: 0 16px 16px 0;
        }
        .desc-text {
            color: var(--text-primary);
            font-size: 1.7rem;
            line-height: 1.6;
            white-space: pre-line;
        }

        .source-section {
            margin-top: 0.5rem;
        }
        .source-label {
            font-size: 1.32rem;
            text-transform: uppercase;
            color: var(--isac-orange);
            letter-spacing: 2.9px;
            margin-bottom: 23px;
            font-weight: bold;
        }
        .weapon-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 23px;
        }
        .weapon-badge {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 133, 0, 0.5);
            border-radius: 77px;
            padding: 0.77rem 1.9rem;
            font-size: 1.54rem;
            font-weight: 500;
            color: #ffda99;
            backdrop-filter: blur(2px);
        }

        .footer-divider {
            margin-top: 3.4rem;
            padding-top: 1.6rem;
            border-top: 2px solid var(--border-glow);
            text-align: right;
            font-size: 1.15rem;
            color: var(--text-dim);
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="scanline"></div>
<div class="talent-card">
    <div class="deco-dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="talent-header">
        <div class="talent-icon">
            <img src="{{ talent.icon_url }}" alt="{{ talent.name }}" onerror="this.src='https://placehold.co/151x151/ff8500/111?text=?'">
        </div>
        <div class="talent-title">
            <div class="talent-name">{{ talent.name }}</div>
            <div class="talent-eng">{{ talent.eng_name }}</div>
        </div>
    </div>

    <div class="talent-description">
        <div class="desc-text">{{ talent.description | safe }}</div>
    </div>

    <div class="source-section">
        <div class="source-label">⚙️ 可装配装备</div>
        <div class="weapon-grid">
            {% set weapons = talent.type.split('\n') %}
            {% for weapon in weapons %}
                {% if weapon|trim != '' %}
                    <span class="weapon-badge">{{ weapon }}</span>
                {% endif %}
            {% endfor %}
        </div>
    </div>

    <div class="footer-divider">
        <span>◈ ISAC 战术分析 · 天赋数据库 ◈</span>
    </div>
</div>
</body>
</html>
